<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />
    <title>Luca Muscat Baron — Web Designer & Full-Stack Developer</title>
    <meta
      name="description"
      content="Portfolio de Luca Muscat Baron — designer web et développeur full-stack. Design, développement et branding."
    />
    <link rel="canonical" href="https://lucamb-portfolio.vercel.app/" />

    <!-- Aperçu au partage (LinkedIn, Slack, messageries). Sans og:image le lien
         apparaît en ligne de texte grise : c'est souvent le premier contact
         qu'un recruteur a avec le site. -->
    <meta property="og:title" content="Luca Muscat Baron — Web Designer & Developer" />
    <meta property="og:description" content="Design, développement web et branding." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lucamb-portfolio.vercel.app/" />
    <meta property="og:image" content="https://lucamb-portfolio.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Instrument Serif (calligraphic accent) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <!-- General Sans (primary) -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <!-- Departure Mono fallback if self-hosted file missing -->
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
