<!-- Source du favicon.ico (16/32 px) : version simplifiée du logo — l'étoile
     seule, agrandie. Les anneaux du logo complet disparaissent sous 32 px et
     rendent l'icône illisible. Le logo complet vit dans public/favicon.svg.
     Régénérer après modif :
     magick -background none src/img/favicon-small.svg -resize 32x32 /tmp/f32.png
     magick -background none src/img/favicon-small.svg -resize 16x16 /tmp/f16.png
     magick /tmp/f16.png /tmp/f32.png public/favicon.ico -->
